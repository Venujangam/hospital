services:
  - type: web
    name: careflow-hospital
    runtime: node
    rootDir: backend
    buildCommand: npm install --omit=dev
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false        # You will set this manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true  # Render auto-generates a secure secret
    healthCheckPath: /api/health
    autoDeploy: true

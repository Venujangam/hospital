<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - CareFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="auth-page">
  <main class="auth-card">
    <h1>Create Account</h1>
    <p>Register a new user for Hospital Management.</p>
    <form id="registerForm" class="inline-form">
      <input type="text" id="registerName" placeholder="Full name" required />
      <input type="email" id="registerEmail" placeholder="Email address" required />
      <input type="password" id="registerPassword" placeholder="Password" required />
      <button type="submit" class="primary-btn">Register</button>
    </form>
    <div class="actions">
      <a class="primary-btn link-btn" href="./login.html">Go to Login</a>
    </div>
  </main>
  <div id="toast" class="toast"></div>
  <script src="./auth.js"></script>
</body>
</html>
